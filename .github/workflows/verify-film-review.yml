name: Verify live film review

on:
  push:
    branches: [yang-theory-film-review]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify both deployed pages, exact film bytes and byte-range playback
        run: |
          python - <<'PY'
          import hashlib, pathlib, time, urllib.request
          base = 'https://yezdangivci.github.io/yang-theory-site/'
          movies = ['yang-theory-film.mp4', 'yang-theory-scrub.mp4']
          expected = {name: hashlib.sha256((pathlib.Path('public/film') / name).read_bytes()).hexdigest() for name in movies}
          for attempt in range(45):
              try:
                  with urllib.request.urlopen(base + 'review.html', timeout=30) as response:
                      assert response.status == 200
                      page = response.read().decode()
                      assert 'PLAY FILM' in page and 'film/yang-theory-film.mp4' in page
                  with urllib.request.urlopen(base, timeout=30) as response:
                      assert response.status == 200
                      landing = response.read().decode()
                      assert 'filmVideo' in landing and 'film/yang-theory-scrub.mp4' in landing
                      assert 'Objects with' in landing and 'Creative Services' in landing
                  for name in movies:
                      digest = hashlib.sha256()
                      movie_url = base + 'film/' + name + '?v=event-master-1573'
                      with urllib.request.urlopen(movie_url, timeout=30) as response:
                          assert response.status == 200
                          assert response.headers.get_content_type() == 'video/mp4'
                          while chunk := response.read(1024 * 1024):
                              digest.update(chunk)
                      assert digest.hexdigest() == expected[name], 'Published film is not this commit\'s render'
                      request = urllib.request.Request(movie_url, headers={'Range': 'bytes=0-1023'})
                      with urllib.request.urlopen(request, timeout=30) as response:
                          assert response.status == 206, 'Video byte-range delivery is unavailable'
                          assert len(response.read()) == 1024
                  print('LIVE_REVIEW_AND_LANDING_VERIFIED', base + 'review.html', base, expected)
                  break
              except Exception as error:
                  if attempt == 44:
                      raise
                  print('Waiting for Pages deployment:', error, flush=True)
                  time.sleep(10)
          PY
